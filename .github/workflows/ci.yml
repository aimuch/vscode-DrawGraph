name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, unit tests & package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.package.outputs.version }}
      file: ${{ steps.package.outputs.file }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package VSIX
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            FILE="drawgraph-${VERSION}.vsix"
          else
            FILE="drawgraph-${VERSION}-${GITHUB_SHA::7}.vsix"
          fi
          # vscode:prepublish runs the type check and the production build.
          npx vsce package --no-dependencies --skip-license --out "$FILE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  integration:
    name: Integration tests (real VS Code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache VS Code download
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json', 'test/integration/runTest.mjs') }}
          restore-keys: vscode-test-${{ runner.os }}-

      # Downloads the latest stable VS Code and drives it under a virtual display.
      # Needs network access: draw.io loads from embed.diagrams.net, PlantUML renders via plantuml.com.
      - name: Run integration tests
        run: xvfb-run -a npm run test:integration

  # Every push to main replaces the rolling "nightly" pre-release with the new VSIX.
  nightly:
    name: Publish nightly build
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-nightly
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FILE: ${{ needs.build.outputs.file }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Replace the nightly release
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          cat > notes.md <<EOF
          Automatic build of \`main\` at ${GITHUB_SHA} (version ${VERSION}). Replaced on every push to \`main\`.

          **Install:** download \`${FILE}\`, then in VS Code open the Extensions view → \`…\` menu → **Install from VSIX…**, or run:

          \`\`\`bash
          code --install-extension ${FILE}
          \`\`\`
          EOF
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly "$FILE" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly build (${SHORT_SHA})" \
            --notes-file notes.md

  # Pushing a tag such as v0.2.0 publishes a versioned release (only after the integration tests pass).
  release:
    name: Publish versioned release
    needs: [build, integration]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FILE: ${{ needs.build.outputs.file }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Check the tag matches package.json
        run: |
          if [[ "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION} (expected v${VERSION})."
            exit 1
          fi

      - name: Create the release
        run: |
          # Release notes: the "## <version>" section of CHANGELOG.md.
          awk -v ver="$VERSION" '
            /^## / { inside = ($2 == ver); next }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "Release ${VERSION}" > notes.md
          fi
          gh release create "$GITHUB_REF_NAME" "$FILE" \
            --verify-tag \
            --title "DrawGraph ${GITHUB_REF_NAME}" \
            --notes-file notes.md
